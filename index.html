<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drift Test">
<meta name="description" content="Guided aerobic threshold heart-rate drift (aerobic decoupling) test with Garmin .fit analysis.">
<title>AeT Drift Test</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{
  --bg:#0f1216; --card:#181d23; --card2:#1f262e; --text:#eef2f6; --muted:#9aa6b2; --line:#2a333d;
  --accent:#3fb6ff; --accent2:#1e90d6; --good:#38c793; --warn:#ffb547; --bad:#ff6b6b; --hr:#ff5d6c; --pace:#4fd1a5;
  --h1:rgba(63,182,255,.14); --h2:rgba(255,181,71,.16); --out:rgba(128,128,128,.14);
  --radius:16px; color-scheme: dark light;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f6f9; --card:#fff; --card2:#eef2f6; --text:#14202b; --muted:#5b6875; --line:#dde3ea; --accent:#0a84d6; --accent2:#0869ab;
    --h1:rgba(10,132,214,.12); --h2:rgba(230,150,20,.15); --out:rgba(100,100,100,.1); --hr:#e0314a; --pace:#139c73; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:30px;line-height:1.1;margin:8px 0 8px}
h2{font-size:24px;margin:8px 0 12px}
h3{font-size:17px;margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:14px}
.hero{padding:10px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.btn{display:block;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;font-size:17px;line-height:1.2;font-family:inherit;padding:14px 16px;margin:10px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121d}
.btn.big{min-height:60px;font-size:19px}
.btn.huge{min-height:84px;font-size:24px;border-radius:20px}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#1d0505}
.btn.small{display:inline-block;width:auto;min-height:44px;font-size:15px;padding:10px 14px;margin:6px 6px 6px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin:10px 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mode{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);color:var(--text);padding:14px 12px;text-align:left;font-family:inherit;cursor:pointer;min-height:130px}
.mode b{display:block;font-size:18px;margin:4px 0}
.mode small{color:var(--muted);font-size:13.5px;line-height:1.3;display:block}
.mode .ico{font-size:26px}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:16px;line-height:1.2;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#04121d}
.seg.small button{min-height:42px;font-size:15px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:16px;line-height:1.2;font-family:inherit}
.tabs button.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field.inline{display:flex;align-items:center;gap:10px}
.field.inline>span{margin:0;flex:1}
.field.inline input{max-width:120px}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;font-size:20px;line-height:1.2;font-family:inherit;padding:10px 12px;font-family:inherit}
select{font-size:15px;font-weight:500}
textarea{font-size:16px;font-weight:400;min-height:70px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 input{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:500;font-size:14px;line-height:1.2;font-family:inherit;padding:8px 12px;cursor:pointer}
.note{font-size:14px;color:var(--muted);margin:8px 0}
.note.center{text-align:center}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px}
.toggle input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.guide summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:40px;display:flex;align-items:center}
.guide ul,.checklist ul{padding-left:20px;margin:8px 0}
.guide li,.checklist li{margin:8px 0;font-size:15px}
.maf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.maf .field{margin:0;flex:0 0 150px}
.cite{font-size:12px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:6px;padding:1px 6px;text-decoration:none;margin-left:2px}
.file{display:flex;align-items:center;justify-content:center;min-height:74px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent);font-weight:700;cursor:pointer;text-align:center;padding:10px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.err{color:var(--bad);font-weight:600}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:13px}
/* run screen */
.runtop{display:flex;justify-content:space-between;align-items:center}
.wake{font-size:13px;border-radius:999px;padding:6px 10px;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.wake.on{color:var(--good);border-color:var(--good)}
.phase{text-align:center;font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:12px;text-transform:uppercase;color:var(--accent)}
.phase.warmup{color:var(--warn)} .phase.test{color:var(--accent)} .phase.cooldown,.phase.done{color:var(--good)}
.timer{text-align:center;font-size:min(30vw,150px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 4px;letter-spacing:-.03em}
.sub{text-align:center;color:var(--muted);font-size:17px;min-height:24px}
body.paused .timer{opacity:.45}
.bar{position:relative;height:18px;border-radius:9px;background:var(--card2);border:1px solid var(--line);margin:18px 0 4px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.bar .half{position:absolute;left:50%;top:-2px;bottom:-2px;width:3px;background:var(--warn)}
.barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.banner{display:none;margin:14px 0;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 20%,var(--card));border:1px solid var(--warn);font-size:18px;font-weight:600}
.banner.show{display:block;animation:pop .3s}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.facts{display:flex;gap:8px;margin:14px 0}
.facts div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts b{font-size:19px}
.reminder{text-align:center;font-size:19px;font-weight:600;min-height:28px;margin:8px 0}
.controls{margin-top:8px}
/* results */
.chart{width:100%;margin:6px 0}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px}
.chart .ax.hr{fill:var(--hr)} .chart .ax.pace{fill:var(--pace)}
.chart .hline{fill:none;stroke:var(--hr);stroke-width:2}
.chart .pline{fill:none;stroke:var(--pace);stroke-width:1.6;opacity:.9}
.chart .h1{fill:var(--h1)} .chart .h2{fill:var(--h2)} .chart .out{fill:var(--out)}
.chart .midline{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 4}
.chart .lap{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
.chart .hlabel{fill:var(--text);font-size:13px;font-weight:700;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.lg::before{content:"";display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.lg.hr::before{background:var(--hr);height:3px} .lg.pace::before{background:var(--pace);height:3px}
.lg.h1::before{background:var(--h1);border:1px solid var(--accent)} .lg.h2::before{background:var(--h2);border:1px solid var(--warn)}
table.stats{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
table.stats th,table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.stats th:first-child,table.stats td:first-child{text-align:left;color:var(--muted)}
table.stats.left td,table.stats.left th{text-align:left}
table.diff{font-size:13px} table.diff td:first-child{font-weight:600}
.tablewrap{overflow-x:auto}
.livepcts{display:flex;gap:16px;font-size:16px;margin-top:6px}
.resultcard{text-align:center;border-width:2px}
.resultcard.aet{border-color:var(--good)} .resultcard.above{border-color:var(--bad)} .resultcard.below{border-color:var(--accent)}
.metric{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.bigpct{font-size:68px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.verdict{font-size:20px;font-weight:700;margin-bottom:10px}
.resultcard.aet .verdict{color:var(--good)} .resultcard.above .verdict{color:var(--bad)} .resultcard.below .verdict{color:var(--accent)}
.scale{position:relative;display:flex;height:14px;border-radius:7px;overflow:visible;margin:14px 4px 4px}
.zone{height:100%} .zone.z1{background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:7px 0 0 7px} .zone.z2{background:var(--good)} .zone.z3{flex:1;background:color-mix(in srgb,var(--bad) 70%,transparent);border-radius:0 7px 7px 0}
.marker{position:absolute;top:-6px;width:4px;height:26px;background:var(--text);border-radius:2px;transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.scalelbl{position:relative;height:18px;font-size:12px;color:var(--muted);margin:0 4px}
.scalelbl span{position:absolute;transform:translateX(-50%)}
.kv{list-style:none;padding:0;margin:8px 0}
.kv li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv li span{color:var(--muted)}
.warns p{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.pill{display:inline-block;min-width:74px;text-align:center;border-radius:999px;padding:5px 10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill.aet{background:var(--good);color:#032014} .pill.above{background:var(--bad);color:#2a0505} .pill.below{background:var(--accent);color:#04121d}
.lastrow{display:flex;gap:10px;align-items:center}
.hist{list-style:none;padding:0;margin:0}
.hist button{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:10px 12px;margin:8px 0;text-align:left;font-family:inherit;cursor:pointer}
.hmain{flex:1}.hmain b{display:block;font-size:16px}.hmain small{color:var(--muted);font-size:13px}
.hband{font-size:12px;color:var(--muted);max-width:80px;text-align:right}
.proto li{margin:10px 0;font-size:15px}
.sources li{margin:8px 0;font-size:14px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;min-height:58px;background:none;border:0;color:var(--muted);font-weight:600;font-size:12px;line-height:1.2;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.nav button span{font-size:21px}
.nav button.on{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:520px;border:1px solid var(--line)}
.sheet p{font-size:18px;margin:0 0 12px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:30;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.running .nav{display:none}
body.running{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav">
  <button data-go="home"><span>⌂</span>Home</button>
  <button data-go="setup"><span>⏱</span>Test</button>
  <button data-go="results"><span>📈</span>Results</button>
  <button data-go="history"><span>☰</span>History</button>
  <button data-go="about"><span>ⓘ</span>About</button>
</nav>
